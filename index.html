    <script>
      let saved;
      try { saved = localStorage.getItem('adrian-theme'); } catch (_) {}
      const mode = ['light', 'dark', 'sunset'].includes(saved) ? saved : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = mode;
      document.documentElement.style.colorScheme = mode === 'light' ? 'light' : 'dark';
    </script>
