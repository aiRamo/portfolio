<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clifftop cats — sculpture study</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#b8aca6}
    canvas{display:block}aside{position:fixed;bottom:24px;left:28px;font:12px/1.6 system-ui;color:#493f3c;pointer-events:none;letter-spacing:.03em}
  </style>
</head>
<body>
  <aside>CLIFFTOP CATS · GEOMETRY STUDY<br>Drag to orbit · Scroll to inspect</aside>
  <script type="module">
    import * as THREE from 'three'
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
    import { createCatTree } from '../src/catTree.mjs'
    const renderer = new THREE.WebGLRenderer({antialias:true})
    renderer.setPixelRatio(Math.min(devicePixelRatio,2))
    renderer.shadowMap.enabled=true
    renderer.shadowMap.type=THREE.PCFShadowMap
    renderer.toneMapping=THREE.ACESFilmicToneMapping
    document.body.append(renderer.domElement)
    const scene=new THREE.Scene()
    scene.background=new THREE.Color('#b8aca6')
    scene.add(createCatTree())
    const ambient=new THREE.HemisphereLight('#e7efff','#847467',2)
    scene.add(ambient)
    const sun=new THREE.DirectionalLight('#ffddb4',3.3)
    sun.position.set(-3,10,6)
    sun.castShadow=true
    sun.shadow.mapSize.set(2048,2048)
    Object.assign(sun.shadow.camera,{left:-6,right:6,top:8,bottom:-5,near:.1,far:40})
    sun.shadow.normalBias=.025
    scene.add(sun)
    const floor=new THREE.Mesh(new THREE.PlaneGeometry(200,200),new THREE.MeshStandardMaterial({color:'#b8aca6',roughness:1}))
    floor.rotation.x=-Math.PI/2;floor.position.y=-.17;floor.receiveShadow=true;scene.add(floor)
    const camera=new THREE.PerspectiveCamera(36,1,.1,200)
    camera.position.set(-6,6.6,15)
    const controls=new OrbitControls(camera,renderer.domElement)
    controls.target.set(-.55,3.5,0)
    controls.enableDamping=true
    function resize(){
      renderer.setSize(innerWidth,innerHeight)
      camera.aspect=innerWidth/innerHeight
      const direction=camera.position.clone().sub(controls.target).normalize()
      camera.position.copy(controls.target).addScaledVector(direction,Math.max(16,13.5/camera.aspect))
      camera.updateProjectionMatrix()
    }
    addEventListener('resize',resize);resize()
    renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera)})
  </script>
</body>
</html>
